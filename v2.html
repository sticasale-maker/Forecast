<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIZ Forecast V2 — when to dive</title>
<meta name="description" content="When to dive, not just whether. 17 Sydney and NSW dive entries, hour by hour.">
<meta name="theme-color" content="#f7f7f5">
<script>
/* Theme before first paint, so a saved choice never flashes the other one. Dark is the
   default (owner, 7 Nov 2026); light only for a viewer who picked it with the toggle. */
(function(){ var t = "dark";
  try { var v = localStorage.getItem("viz_v2_theme"); if (v === "light" || v === "dark") t = v; } catch (e) {}
  document.documentElement.setAttribute("data-theme", t);
  if (t === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#121210");
})();
</script>
<!--
  VIZ FORECAST v2 — the thin client for /forecast2.

  SHIPS NO MODEL. Every number on this page arrives from the Worker. There are no lobes,
  no sensitivities, no exponents, no thresholds and no coastline geometry in this file,
  and none may ever be added: once a constant is in the page it is in the git history and
  in every cache for ever. v1's index.html scores in the browser and therefore ships its
  own tuning; moving that server-side is the entire reason /forecast2 exists. The only
  model-adjacent numbers here are the two BAND CUTS, which are display semantics — the
  same Easy/Caution/Avoid v1 shows — not tuning.

  TIME-FIRST, BY REGION (owner, 23 Oct 2026). v1 ranked 14 sites by score. With 17 over
  350 km that is a category error: nobody chooses between Seal Rocks and Oak Park on the
  same morning. So sites are grouped by region, and the hero of each row is a strip of the
  day's hours rather than a single number — because the useful answer is "go at 7, not
  11", and 241 hours of forecast is what v2 has that v1 did not.

  CONFIDENCE IS VISIBLE BUT QUIET (owner). A site resting on five reports should not look
  as certain as one resting on sixty-two. The counts below are provenance, not model.
-->
<style>
  :root {
    color-scheme: light;
    --bg:#f7f7f5; --surface:#fff; --line:#e4e3de; --rule:#f0efea;
    --ink:#15150f; --ink-2:#55544c; --ink-3:#8d8c82;
    --easy:#1b8a4b; --easy-bg:#d8f0e1;
    --caution:#b07503; --caution-bg:#fbeecd;
    --avoid:#bf3024; --avoid-bg:#fbddd9;
    /* Strip cells step from these, not from the pale -bg tints: three steps mixed out of a
       pastel differed by a few percent of lightness and the nuance was unreadable. */
    --easy-cell:#1fa35a; --caution-cell:#f0a500; --avoid-cell:#e0392b;
    --none:#f2f1ec;
    --accent:#0c5c8a;
    --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg:#121210; --surface:#1b1b18; --line:#2e2e29; --rule:#232320;
      --ink:#f2f1ea; --ink-2:#b4b3a8; --ink-3:#7d7c72;
      --easy:#4fc27e; --easy-bg:#17361f;
      --caution:#e0a52a; --caution-bg:#3a2d0c;
      --avoid:#ef6a5c; --avoid-bg:#3d1713;
      --easy-cell:#3ec26f; --caution-cell:#f2ae2e; --avoid-cell:#f0584a;
      --none:#232320; --accent:#64b5e6;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  /* The header toggle's explicit choice; same values as the system-dark block above. */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:#121210; --surface:#1b1b18; --line:#2e2e29; --rule:#232320;
    --ink:#f2f1ea; --ink-2:#b4b3a8; --ink-3:#7d7c72;
    --easy:#4fc27e; --easy-bg:#17361f;
    --caution:#e0a52a; --caution-bg:#3a2d0c;
    --avoid:#ef6a5c; --avoid-bg:#3d1713;
    --easy-cell:#3ec26f; --caution-cell:#f2ae2e; --avoid-cell:#f0584a;
    --none:#232320; --accent:#64b5e6;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{
    background:var(--bg);color:var(--ink);
    font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;padding-bottom:48px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:0 16px}

  /* The header, day picker included, stays put: scrolled down to a southern site, the
     days must still be one tap away. */
  header{padding:8px 0 6px;position:sticky;top:0;z-index:20;background:var(--bg);
         margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px}
  .brand img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0}
  /* the header is one size, scrolled or not (owner, 7 Nov): small logo, title, days */
  header.compact .sub{display:none}
  .theme-btn{margin-left:auto;align-self:center;width:30px;height:30px;border-radius:50%;
    border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;
    display:grid;place-items:center;font-size:14px;line-height:1}
  .theme-btn:hover{color:var(--ink)}
  h1{font-size:19px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:4px 9px;flex-wrap:wrap}
  h1 b{white-space:nowrap}
  h1 b{font-weight:800}
  h1 span{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
          color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:1px 5px}
  .sub{color:var(--ink-3);font-size:12.5px;margin-top:4px}
  h1 .upd{font-style:normal;font-size:12px;font-weight:500;letter-spacing:0;color:var(--ink-3);white-space:nowrap}
  .sub b{color:var(--ink-2);font-weight:600}

  /* day picker */
  .days{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;margin:0 -16px;
        padding-left:16px;padding-right:16px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);
       border-radius:9px;padding:6px 11px;cursor:pointer;text-align:center;
       font:inherit;color:var(--ink-2);min-width:58px}
  .day b{display:block;font-size:13px;color:var(--ink);font-weight:700}
  .day i{display:block;font-size:10.5px;font-style:normal;letter-spacing:.05em;
         text-transform:uppercase;color:var(--ink-3)}
  .day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
  .day[aria-pressed="true"] b,.day[aria-pressed="true"] i{color:var(--bg)}

  /* region + rows */
  .region{margin:22px 0 0}
  .region h2{font-size:13.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
             color:var(--ink-3);display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .region h2 em{font-style:normal;font-weight:500;letter-spacing:0;text-transform:none;
                font-size:12.5px;color:var(--ink-3);opacity:.8}
  .rows{background:var(--surface);border:1px solid var(--line);border-radius:12px;
        box-shadow:var(--shadow);overflow:hidden}
  .row{display:block;width:100%;text-align:left;background:none;border:0;
       border-top:1px solid var(--rule);padding:11px 13px;cursor:pointer;font:inherit;color:inherit}
  .row:first-child{border-top:0}
  .row-foot{display:flex;align-items:center;gap:10px}
  .exp{margin-left:auto;margin-top:6px;font:inherit;font-size:12.5px;font-weight:600;color:var(--accent);
       background:none;border:0;padding:4px 0 2px 8px;cursor:pointer;white-space:nowrap}
  .strip.tap .cell{cursor:pointer}
  .row-top{display:flex;align-items:baseline;gap:9px}
  .name{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
  .verdict{margin-left:auto;font-size:12.5px;font-weight:600;white-space:nowrap}
  .verdict.easy{color:var(--easy)} .verdict.caution{color:var(--caution)}
  .verdict.avoid{color:var(--avoid)} .verdict.none{color:var(--ink-3);font-weight:500}

  /* the strip — the hero of the row */
  .strip{display:flex;gap:2px;margin-top:7px;height:19px}
  .cell{flex:1;border-radius:2px;background:var(--none);position:relative}
  .cell.easy{--cellc:var(--easy-cell)} .cell.caution{--cellc:var(--caution-cell)}
  .cell.avoid{--cellc:var(--avoid-cell)}
  /* Three steps per band, wide apart: light = the safe end of the band, deep = the end
     nearest the next band down. */
  .cell.easy,.cell.caution,.cell.avoid{background:color-mix(in srgb, var(--cellc) 62%, var(--surface))}
  .cell.s1{background:color-mix(in srgb, var(--cellc) 34%, var(--surface))}
  .cell.s2{background:color-mix(in srgb, var(--cellc) 62%, var(--surface))}
  .cell.s3{background:color-mix(in srgb, var(--cellc) 92%, var(--surface))}
  .day.past i,.day.past b{opacity:.45}
  .cell.now{outline:2px solid var(--ink);outline-offset:1px;z-index:1}
  /* the hour the map and stats are showing */
  .cell.sel{outline:2.5px solid var(--accent);outline-offset:1px;z-index:2}
  .maphint{font-size:11.5px;color:var(--ink-3);font-weight:400;text-transform:none;letter-spacing:0}
  .ticks{display:flex;gap:2px;margin-top:3px}
  .ticks span{flex:1;font-size:11.5px;font-weight:500;color:var(--ink-2);text-align:center;
              letter-spacing:-.02em;white-space:nowrap;overflow:visible;font-variant-numeric:tabular-nums}

  .conf{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-3);
        margin-top:6px}
  .conf.thin{color:var(--caution)}
  h3.sub{font-size:11px;font-weight:400;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ink-3);margin:18px 0 6px 2px}
  .ask{background:var(--caution-bg);border-radius:10px;padding:11px 13px;margin:8px 0 2px}
  .askh{margin:0 0 4px;font-size:14px;color:var(--caution)}
  .askb{margin:0 0 9px;font-size:12.5px;line-height:1.55;color:var(--caution)}
  .askbtn{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--caution);
    background:var(--surface);color:var(--caution);border-radius:7px;cursor:pointer}
  .askok{display:block;margin-top:7px;font-size:12px;color:var(--caution)}

  /* detail */
  .detail{border-top:1px solid var(--rule);padding:12px 13px 14px;background:var(--rule)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:10px 12px}
  .stat b{display:block;font-size:10px;font-weight:700;letter-spacing:.07em;
          text-transform:uppercase;color:var(--ink-3)}
  .stat span{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .ten{margin-top:13px}
  .ten b{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
         color:var(--ink-3);display:block;margin-bottom:5px}
  .ten .strip{height:13px}
  .dayv{font-size:14px;line-height:1.55;color:var(--ink);margin:0 0 12px}
  .dayv b{font-weight:650}
  .tg{margin-top:13px;display:flex;flex-direction:column;gap:7px}
  .tg-line{display:flex;gap:9px;font-size:12.5px;line-height:1.5;color:var(--ink-2);
           padding:8px 10px;border-radius:8px;background:var(--surface);border-left:3px solid var(--line)}
  .tg-line.good{border-left-color:var(--easy)} .tg-line.bad{border-left-color:var(--caution)}
  .tg-key{flex:0 0 74px;font-weight:700;color:var(--ink);font-size:12px}
  .tg-line b{color:var(--ink);font-weight:600}
  .tg-state{color:var(--ink-3)}
  .tg-line a{color:var(--accent)}
  .why{margin-top:11px;font-size:12.5px;color:var(--ink-2);line-height:1.5}

  /* site map, inside an open row */
  .mapcard{margin:0 0 13px}
  .mapcard b.lbl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
         color:var(--ink-3);display:block;margin-bottom:5px}
  #siteMapCanvas{width:100%;display:block;border-radius:9px}
  /* Sydney overview */
  .ov{margin-top:16px}
  .ov-head{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
  .ov-head h2{font-size:13.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
  .ov-head h2 span{font-weight:500;letter-spacing:0;text-transform:none;font-size:12.5px}
  .ov-head .exp{margin-top:0}
  #ovCanvas{width:100%;display:block;border-radius:10px;cursor:pointer}
  .ov-slide{margin-top:8px}
  .ov-slide input{width:100%;accent-color:var(--accent)}
  .ov-slide .ticks span{font-size:11px}
  /* coffee */
  .coffee{margin-top:26px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);
          border-radius:12px;box-shadow:var(--shadow)}
  .coffee p{font-size:13px;color:var(--ink-2);line-height:1.55;margin-bottom:12px}
  .coffee a{display:inline-flex;align-items:center;gap:9px;background:#FFDD00;color:#222;
            font-size:14px;font-weight:700;border-radius:10px;padding:10px 20px;text-decoration:none;
            box-shadow:0 2px 12px rgba(255,221,0,.25)}
  .coffee a:hover{opacity:.85}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0 0;font-size:11.5px;color:var(--ink-3)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;
            margin-right:5px;vertical-align:-1px}
  .legend i.st{width:9px;margin-right:1px}
  .legend i.st:last-of-type{margin-right:5px}
  footer{margin-top:26px;font-size:11.5px;color:var(--ink-3);line-height:1.6}
  footer a{color:var(--accent)}
  .disclaimer{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:11px}
  .msg{padding:36px 0;text-align:center;color:var(--ink-3);font-size:13.5px}
  /* every second hour is labelled; a phone too narrow for that keeps every fourth */
  @media (max-width:340px){ .ticks span:not(.t4){visibility:hidden} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="image_2.png" alt="VIZ logo">
      <div>
        <h1><b>Forecast</b> <span>V2</span> <em class="upd" id="sub">loading…</em></h1>
      </div>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch light or dark"></button>
    </div>
    <div class="days" id="days"></div>
  </header>
  <section class="ov" id="ov" hidden>
    <div class="ov-head"><h2>Sydney <span id="ovWhen"></span></h2>
      <button class="exp" id="ovToggle" type="button" aria-expanded="true">Hide ▴</button></div>
    <div id="ovBody">
      <canvas id="ovCanvas"></canvas>
      <div class="ov-slide"><input type="range" id="ovHour" min="5" max="22" step="1" aria-label="Hour">
        <span class="ticks" id="ovTicks"></span></div>
    </div>
  </section>
  <main id="main"><p class="msg">Fetching conditions…</p></main>
  <div class="legend" id="legend"></div>
  <div class="coffee">
    <p>This app is free, non-profit and built in spare time. If it saved you a bad dive, a coffee
      goes a long way and makes running costs more sustainable without adding ads or subscriptions 😊</p>
    <a href="https://www.buymeacoffee.com/vizforecast" target="_blank" rel="noopener">
      <span style="font-size:24px;line-height:1">☕</span> Offer me a coffee
      <span style="font-size:20px;line-height:1" aria-hidden="true">🥱</span></a>
  </div>
  <footer id="foot"></footer>
</div>

<script>
"use strict";
/* Light/dark toggle: dark by default, then remembers this device's choice. */
(function(){
  var btn = document.getElementById("themeBtn"), root = document.documentElement;
  var sysDark = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  function isDark(){
    var t = root.getAttribute("data-theme");
    return t ? t === "dark" : !!(sysDark && sysDark.matches);
  }
  function paint(){
    var d = isDark();
    btn.textContent = d ? "☀" : "☾";
    btn.setAttribute("aria-label", d ? "Switch to light" : "Switch to dark");
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", d ? "#121210" : "#f7f7f5");
  }
  btn.addEventListener("click", function(){
    var next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("viz_v2_theme", next); } catch (e) {}
    paint();
  });
  if (sysDark && sysDark.addEventListener) sysDark.addEventListener("change", paint);
  var hdr = document.querySelector("header");
  /* hysteresis: shrinking the header moves the page under it, which must not flip it back */
  function slim(){ var y = window.scrollY, c = hdr.classList.contains("compact");
    if (!c && y > 90) hdr.classList.add("compact"); else if (c && y < 8) hdr.classList.remove("compact"); }
  window.addEventListener("scroll", slim, { passive: true }); slim();
  paint();
})();
var API = "https://bold-rain-6ded.sticasale.workers.dev/forecast2";

/* The two band cuts, on the Worker's internal 0-60 scale. DISPLAY semantics, the same
   Easy/Caution/Avoid v1 shows — not tuning, and the only cuts this file may hold. */
var EASY = 40, CAUTION = 20;
function band(s){ return s == null ? "none" : s >= EASY ? "easy" : s >= CAUTION ? "caution" : "avoid"; }
function bandName(b){ return b === "easy" ? "Easy" : b === "caution" ? "Caution"
                          : b === "avoid" ? "Avoid" : "No forecast"; }

/* WHERE IN THE BAND THE SCORE SITS. Three bands alone cannot show it: 68% and 98% are both
   "easy" and looked identical, so a strip could not show a day getting worse until it
   crossed a cut (owner, 2 Nov: "you can't see where in the color is the score").

   Three steps per band, and DEEPER ALWAYS MEANS WORSE across all nine, so the whole strip
   reads as one severity gradient rather than three unrelated ramps. MAX is the top of the
   Worker's internal scale — display semantics, like EASY and CAUTION, not tuning. */
var MAX = 60;
function step(v){
  if (v == null) return "";
  var top = v >= EASY ? MAX : v >= CAUTION ? EASY : CAUTION;
  var range = v >= EASY ? MAX - EASY : EASY - CAUTION;
  if (!(range > 0)) return "s2";
  var sev = (top - v) / range;
  return "s" + Math.max(1, Math.min(3, 1 + Math.floor(sev * 3)));
}

/* Regions north to south. Grouping, not geography the model uses — the Worker sends the
   order and these are the human names for the clusters in it. */
/* THE OWNER'S FOUR REGIONS (2 Nov 2026), because the binding constraint is driving
   distance, not latitude. Below-the-bridge holds 11 of 18 sites, too long to scan, so it
   sub-splits — the top level stays the owner's four.

   CAMP COVE IS BELOW THE BRIDGE, and latitude would get that wrong. At -33.8391 it sits
   north of the bridge's own latitude (-33.8523), but Watsons Bay is on the SOUTH shore and
   it is an eastern-suburbs site. Chowder at -33.8398 is almost the same latitude and
   genuinely north shore. Group by shore, not by number.

   Grouping only — the Worker sends the order and these are the human names for it. */
var REGIONS = [
  ["Far north", "3 hours up the coast", [
    ["", ["SealRocks"]]
  ]],
  ["Above the bridge", "", [
    ["", ["Freshwater", "Fairlight", "CTB", "Chowder"]]
  ]],
  ["Below the bridge", "", [
    ["Eastern suburbs", ["CampCove", "NorthBondi", "SharkPoint", "Gordons", "SouthCoogee", "LittleBay"]],
    ["Botany Bay and Kurnell", ["BIE", "BIW", "BIWestmost", "Monument", "Steps"]],
    ["Cronulla", ["Oak"]]
  ]],
  ["Far south", "about 90 minutes", [
    ["", ["BassPoint", "Bushranger"]]
  ]]
];
var LABEL = {
  SealRocks:"Seal Rocks", Freshwater:"Freshwater", Fairlight:"Fairlight",
  CTB:"CTB - Bower Ln", Chowder:"Chowder Bay", CampCove:"Camp Cove",
  NorthBondi:"North Bondi", SharkPoint:"Shark Point", Gordons:"Gordons Bay",
  SouthCoogee:"South Coogee", LittleBay:"Little Bay", BIE:"Bare Island east",
  BIW:"Bare Island west", Monument:"The Monument", Steps:"The Steps",
  Oak:"Oak Park", BassPoint:"Bass Point", Bushranger:"Bushrangers Bay",
  BIWestmost:"Bare Island westmost"
};
/* PROVENANCE, NOT MODEL: how much evidence stands behind each site, and what that makes
   the score worth saying out loud. Counts and a tier — no sensitivities, no thresholds, no
   lobe. Regenerate from `node tools/site_status.mjs`; last taken 2 Nov 2026.

   Showing Steps at 88% and Chowder at 98% with equal confidence is a lie: one has 59
   verdicts, the other none. Every row states its evidence.

   tier:  "fitted"    25+ verdicts and passing both of the owner's release criteria
          "borrowed"  calibrated elsewhere (CTB is the Manly Swim surge at Bower Lane)
          "sheltered" no node and no swell response to model (Camp Cove)
          "thin"      passes both criteria, but on too few verdicts to lean on
          "checking"  plenty of verdicts AND one release criterion still failing
          "none"      no verdicts at all — the number is a guess from a neighbour
          "hold"      known wrong at the hard end; see SERVER_SIDE_PLAN.md C6 */
var REPORTS = {
  Steps:59, BIW:46, BassPoint:42, SharkPoint:25, Monument:25, Oak:15, Bushranger:11,
  Gordons:9, LittleBay:6, SealRocks:5, NorthBondi:3, Freshwater:3, Fairlight:1,
  SouthCoogee:1, Chowder:0, BIE:0, CampCove:0, CTB:0, BIWestmost:0
};
var TIER = {
  Steps:"fitted", BIW:"fitted", Monument:"fitted", SharkPoint:"fitted",
  CTB:"borrowed", CampCove:"sheltered",
  BassPoint:"checking", Oak:"checking", Gordons:"checking",
  Bushranger:"thin", SealRocks:"thin", NorthBondi:"thin", Fairlight:"thin",
  Chowder:"none", BIE:"none", SouthCoogee:"none", BIWestmost:"none",
  LittleBay:"hold", Freshwater:"hold"
};

var DAY0 = 5, DAY1 = 22;           /* dawn to 10pm: the dive hours, night dives included */
var data = null, dayIx = 0, openSite = null;
/* The hour the open site's map and stats show, picked by tapping the bar. It is an hour of
   the day, not an index, so it carries across days: pick a day, then a time. */
var selH = null;
/* Sydney, because the forecast is in Sydney hours and the viewer may not be. */
var TODAY = new Intl.DateTimeFormat("en-CA", { timeZone: "Australia/Sydney" }).format(new Date());
var TOMORROW = new Intl.DateTimeFormat("en-CA", { timeZone: "Australia/Sydney" })
  .format(new Date(Date.now() + 86400000));

function hourOf(s){ return parseInt(String(s).slice(11,13),10); }
function dateOf(s){ return String(s).slice(0,10); }
function fmtHour(h){ return h === 12 ? "12p" : h > 12 ? (h-12)+"p" : h+"a"; }

/* Index the payload's flat hour array into days, once. */
function buildDays(hours){
  var days = [], seen = {};
  for (var i = 0; i < hours.length; i++) {
    var d = dateOf(hours[i]), h = hourOf(hours[i]);
    if (!(d in seen)) { seen[d] = days.length; days.push({ date:d, idx:[] }); }
    if (h >= DAY0 && h <= DAY1) days[seen[d]].idx.push({ i:i, h:h });
  }
  return days.filter(function(x){ return x.idx.length >= 6; }).slice(0,10);
}

/* Describe a day in one phrase: the longest run of the best band present. */
function summarise(cells){
  var have = {};
  cells.forEach(function(c){ have[c.b] = 1; });
  var best = have.easy ? "easy" : have.caution ? "caution" : have.avoid ? "avoid" : "none";
  if (best === "none") return { b:"none", t:"No forecast" };
  var bestRun = null, run = null;
  for (var i = 0; i < cells.length; i++) {
    if (cells[i].b === best) { if (!run) run = { a:i, z:i }; else run.z = i; }
    else { if (run && (!bestRun || run.z-run.a > bestRun.z-bestRun.a)) bestRun = run; run = null; }
  }
  if (run && (!bestRun || run.z-run.a > bestRun.z-bestRun.a)) bestRun = run;
  var name = bandName(best);
  if (bestRun.z - bestRun.a + 1 === cells.length) return { b:best, t:name + " all day" };
  var from = cells[bestRun.a].h, to = cells[bestRun.z].h, phrase;
  if (bestRun.a === 0) phrase = name + " till " + fmtHour(to+1);
  else if (bestRun.z === cells.length-1) phrase = name + " from " + fmtHour(from);
  else phrase = name + " " + fmtHour(from) + "–" + fmtHour(to+1);

  /* NAME THE DETERIORATION. Describing only the best run read "Caution till 3p" on a
     Shark Point day whose strip turned Avoid at 3p — the one fact a diver needed, left
     out. If the day holds a worse band than the headline, it is said, and which side of
     the window it falls on. */
  var rank = { easy:3, caution:2, avoid:1, none:0 }, worst = best, worstAfter = false;
  for (var j = 0; j < cells.length; j++) {
    if (j >= bestRun.a && j <= bestRun.z) continue;
    if (rank[cells[j].b] && rank[cells[j].b] < rank[worst]) {
      worst = cells[j].b; worstAfter = j > bestRun.z;
    }
  }
  if (worst !== best) phrase += ", " + bandName(worst) + (worstAfter ? " after" : " earlier");
  return { b:best, t:phrase };
}

function cellsFor(key, day){
  var s = data.sites[key];
  return day.idx.map(function(p){
    var v = s && s.score ? s.score[p.i] : null;
    return { h:p.h, i:p.i, v:v, b:band(v) };
  });
}

function nowIndex(){
  var now = new Date(), best = -1, bestD = Infinity;
  for (var i = 0; i < data.hours.length; i++) {
    var t = new Date(data.hours[i].replace(" ","T") + "+11:00");
    var d = Math.abs(t - now);
    if (d < bestD) { bestD = d; best = i; }
  }
  return bestD < 3*3600*1000 ? best : -1;
}

function confidenceEl(key){
  var n = REPORTS[key], t = TIER[key];
  if (t === "borrowed")  return '<span class="conf">✓ mirrors the Manly Swim surge model</span>';
  if (t === "sheltered") return '<span class="conf">✓ wind chop only — no swell reaches here</span>';
  if (t === "hold")      return '<span class="conf thin">⚠ under review — known wrong in bigger seas</span>';
  if (t === "fitted")    return '<span class="conf">✓ ' + n + ' diver reports behind this</span>';
  /* "checking" and "thin" are DIFFERENT problems and must not share a sentence. Bass Point
     has 42 verdicts and is provisional because a dived day still reads Avoid; Fairlight has
     one verdict and no failing check. "Only 42 diver reports" read as nonsense. */
  if (t === "checking")  return '<span class="conf thin">⚠ ' + n
                              + ' reports, and one check still failing</span>';
  if (t === "none")      return '<span class="conf thin">⚠ '
                              + (n > 0 ? 'barely calibrated — ' + n + ' local report'
                                         + (n > 1 ? 's' : '')
                                       : 'not calibrated — no local reports') + '</span>';
  return '<span class="conf thin">⚠ only ' + n + ' diver report' + (n > 1 ? 's' : '')
       + ' behind this</span>';
}

/* ASK ONLY WHERE AN ANSWER WOULD CHANGE A NUMBER. 85% of all hours are Easy, and a page
   that said "Easy" every day would score 85% band agreement — so a tap confirming an Easy
   hour cannot separate a good model from a constant. The scarce datum is a NAMED verdict on
   a NON-EASY hour at a site that is not already calibrated. See SERVER_SIDE_PLAN.md C4.

   It asks for a VIZ post rather than an in-app tap on purpose (owner, 2 Nov: "a proper
   named post on VIZ is more reliable"). The draft carries site, date and a clock time,
   which is the shape tools/corpus.py already parses — so the post becomes a VERDICT with a
   name on it, through the existing pipeline, rather than an anonymous number. */
function askEl(key, sum, day){
  if (sum.b === "easy" || sum.b === "none") return "";
  var t = TIER[key];
  if (t === "fitted" || t === "borrowed" || t === "sheltered") return "";
  /* NEVER ASK ABOUT A DAY THAT HAS NOT HAPPENED. Asking a diver to rate Saturday is asking
     for a prediction, which is the model's job and not evidence of anything. Only today and
     earlier. (This fired on a day six ahead the first time it was rendered.) */
  if (!day || !day.date || day.date > TODAY) return "";
  var NL = String.fromCharCode(10);
  var draft = [LABEL[key] + ", " + day.date + ", in the water __:__ .",
               "App said " + bandName(sum.b) + ". I would call it ___",
               "Viz ___ m, water ___ C."].join(NL);
  return '<div class="ask"><p class="askh">Diving ' + LABEL[key] + '? Tell the group how it went.</p>'
       + '<p class="askb">' + (REPORTS[key] > 0
            ? (TIER[key] === "checking"
                 ? 'This site has ' + REPORTS[key] + ' reports and still fails one of our checks.'
                 : 'Only ' + REPORTS[key] + ' report' + (REPORTS[key] > 1 ? 's' : '') + ' stand behind this score.')
            : 'Nothing local stands behind this score yet.')
       + ' A named post on VIZ is worth far more than a tap — it carries your name, the hour '
       + 'and your own words. Best written after you are out.</p>'
       + '<button class="askbtn" data-draft="' + draft.replace(/"/g, "&quot;").split(NL).join("&#10;")
       + '">Copy a VIZ post</button>'
       + '<span class="askok" hidden>Copied — paste it into the VIZ group</span></div>';
}

function render(){
  var day = DAYS[dayIx], nowI = nowIndex(), html = "";
  REGIONS.forEach(function(reg){
    var subs = reg[2].map(function(sub){
      return [sub[0], sub[1].filter(function(k){
        return data.sites[k] || (data.noNode || []).indexOf(k) >= 0;
      })];
    }).filter(function(sub){ return sub[1].length; });
    if (!subs.length) return;
    html += '<section class="region"><h2>' + reg[0]
          + (reg[1] ? ' <em>' + reg[1] + '</em>' : '') + '</h2>';
    subs.forEach(function(sub){
      if (sub[0]) html += '<h3 class="sub">' + sub[0] + '</h3>';
      html += '<div class="rows">';
      sub[1].forEach(function(key){
        var unavailable = !data.sites[key];
        var cells = unavailable ? [] : cellsFor(key, day);
        var sum = unavailable ? { b:"none", t:"Not forecast yet" } : summarise(cells);
        var isOpen = openSite === key && !unavailable;
        html += '<div class="row" data-site="' + key + '">'
              + '<span class="row-top"><span class="name">' + LABEL[key] + '</span>'
              + '<span class="verdict ' + sum.b + '">' + sum.t + '</span></span>';
        if (!unavailable) {
          var shown = isOpen ? pickCell(cells, nowI) : null;
          html += '<span class="strip tap">' + cells.map(function(c){
            return '<span class="cell ' + c.b + ' ' + step(c.v) + (c.i === nowI ? ' now' : '')
                 + (shown && c.h === shown.h ? ' sel' : '') + '" data-h="' + c.h
                 + '" role="button" aria-label="Show ' + fmtHour(c.h) + '" title="'
                 + fmtHour(c.h) + ' — ' + bandName(c.b) + '"></span>';
          }).join("") + '</span><span class="ticks">' + cells.map(function(c){
            return '<span' + (c.h % 4 === 2 ? ' class="t4"' : '') + '>'
                 + (c.h % 2 === 0 ? fmtHour(c.h) : '') + '</span>';
          }).join("") + '</span>';
        }
        html += '<span class="row-foot">' + confidenceEl(key)
              + (unavailable ? '' : '<button class="exp" type="button" aria-expanded="' + isOpen + '">'
                 + (isOpen ? 'Hide ▴' : 'Details ▾') + '</button>') + '</span></div>';
        if (isOpen) {
          html += detailFor(key, cells, nowI) + askEl(key, sum, day);
        }
      });
      html += '</div>';
    });
    html += '</section>';
  });
  document.getElementById("main").innerHTML = html;
  mountMap();
  /* Re-rendering can open or close a row above this one; keep the tapped row where the
     finger left it. */
  function keep(key, fn){
    var el = document.querySelector('.row[data-site="' + key + '"]');
    var y0 = el ? el.getBoundingClientRect().top : 0, wasOpen = openSite === key;
    fn(); render();
    var el2 = document.querySelector('.row[data-site="' + key + '"]');
    if (!el2) return;
    if (openSite === key && !wasOpen) {
      /* A site just opened: bring it up under the frozen header, so the other sites' bars
         are off screen and only this one's bar, map and verdict are in view. The header
         slims once scrolled, so settle its size first, then measure it. */
      var hdr = document.querySelector("header");
      if (el2.getBoundingClientRect().top + window.scrollY > 90) hdr.classList.add("compact");
      var target = el2.getBoundingClientRect().top + window.scrollY;   /* measured after slimming */
      window.scrollTo(0, Math.max(0, target - hdr.offsetHeight));
    } else if (el) window.scrollBy(0, el2.getBoundingClientRect().top - y0);
  }
  [].forEach.call(document.querySelectorAll(".row"), function(r){
    var key = r.dataset.site, ex = r.querySelector(".exp"), st = r.querySelector(".strip.tap");
    if (ex) ex.onclick = function(){ keep(key, function(){ openSite = openSite === key ? null : key; }); };
    if (st) st.onclick = function(ev){
      var c = ev.target.closest ? ev.target.closest(".cell") : null;
      if (!c || c.dataset.h == null) return;
      keep(key, function(){ selH = +c.dataset.h; openSite = key; });
      renderOverview();
    };
  });
  /* The draft goes to the clipboard rather than anywhere of ours: the post belongs to the
     diver, in the group, under their name. Nothing is sent from here. */
  [].forEach.call(document.querySelectorAll(".askbtn"), function(b){
    b.onclick = function(ev){
      ev.stopPropagation();
      var ok = b.parentNode.querySelector(".askok");
      var txt = b.dataset.draft;
      function done(){ if (ok) { ok.hidden = false; } b.textContent = "Copied"; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(done, function(){ b.textContent = "Press and hold to copy"; });
      } else {
        b.textContent = "Press and hold to copy";
      }
    };
  });
}

/* SITE MAP. The renderer and the coastlines are v1's; what feeds them here is only what
   the Worker sent for this site and hour: the node's swell (height, period, direction)
   and the wind. Arrows and shelter come from the coastline geometry alone, and the chop
   level is wind speed, a display choice and not a score input. One canvas is kept for the
   page and moved into whichever row is open, because render() rebuilds the rows. */
var _mapCanvas = null, _map = null, _mapReq = null;
function mapSlot(key, pick, wind){
  _mapReq = null;
  if (typeof SITE_COAST === "undefined" || !SITE_COAST[key]) return "";
  var S = data.sites[key], i = pick.i;
  function at(a){ return a && a[i] != null ? a[i] : null; }
  var windOnly = (data.windOnly || []).indexOf(key) >= 0 || (data.noNode || []).indexOf(key) >= 0
              || key === "Chowder";
  var k = wind && wind.k != null ? wind.k : 0;
  _mapReq = { key: key, name: LABEL[key] || key, d: {
    swellDir: at(S.swellDir), swellH: at(S.swellH), swellP: at(S.swellP),
    windDir: wind ? wind.d : null, windKmh: k,
    chop: Math.max(0, Math.min(1, (k - 5) / 30)), windOnly: windOnly } };
  var dd = new Date(DAYS[dayIx].date + "T12:00:00+11:00")
    .toLocaleDateString("en-AU", { weekday:"short", day:"numeric", month:"short" });
  return '<div class="mapcard"><b class="lbl">Map · ' + dd + ', ' + fmtHour(pick.h)
    + ' <span class="maphint">— tap an hour on the bar to move it</span></b>'
    + '<div id="mapSlot"></div></div>';
}
function mountMap(){
  var slot = document.getElementById("mapSlot");
  if (!slot || !_mapReq || typeof VizSiteMap === "undefined") return;
  if (!_mapCanvas) { _mapCanvas = document.createElement("canvas"); _mapCanvas.id = "siteMapCanvas"; }
  slot.appendChild(_mapCanvas);
  if (!_map) _map = VizSiteMap.create(_mapCanvas);
  if (!_map.set(_mapReq.key, _mapReq.name, _mapReq.d)) slot.parentNode.style.display = "none";
}

/* ENTRY / CLARITY NOTES — v1's two tide lenses, DISPLAY ONLY (nothing here touches a score).
   Clarity at the Botany Bay entries: the outgoing tide drains murkier bay water past them,
   so they run clearest on the incoming. Elsewhere only what Michael McFadyen states plainly
   on his site pages (`tide`), plus his short notes; v1's SITE_MCF, copied. BI Westmost is in
   the same bay as BI West, so it gets the Botany clarity story but no McFadyen page. */
var BOTANY = { Steps:1, Monument:1, BIE:1, BIW:1, BIWestmost:1 };
var MCF_BASE = "https://www.michaelmcfadyenscuba.info/viewpage.php?page_id=";
var MCF = {
  CTB:{id:488,tide:"any"}, BIE:{id:256,tide:"any"}, Monument:{id:311,tide:"any"},
  BIW:{id:261,tide:"any",note:"Tides have little impact; an outgoing tide can put a current through the deep section."},
  Steps:{id:288,tide:"any",note:"Entry is swell-gated — reconsider if the Monuments buoy is over ~0.8 m."},
  Chowder:{id:270,tide:"high",note:"Shallow — best at high tide; as little as 2 m over much of the route at low water."},
  CampCove:{id:267,tide:"high",note:"Shallow bay; a metre or two deeper on a high tide. Well sheltered from southerly seas."},
  Fairlight:{id:636,tide:"high",note:"“Best at or near high tide.” Shallow entry — flop in, do not jump."},
  Gordons:{id:282,tide:"incoming",note:"“Better on the incoming tide.” Good day or night dive."},
  SharkPoint:{id:325,tide:"any",note:"Advanced only — exposed entry, not for inexperienced divers without a guide."},
  LittleBay:{id:297,tide:"any"},
  Oak:{id:314,tide:"incoming",note:"Viz 3–15 m (avg 7–8), marginally better on an incoming tide. Behind-pool entry at low tide."},
  NorthBondi:{id:313,tide:"any",note:"Ben Buckler Point; pick the entry to the sea state — calm seas open the southern platform. The flat rock area is entry-only and best at low tide; otherwise enter and exit via the boat ramp."}
};

/* The weather group a site reads (wind, tide), and the Worker's own fallback to `main`. */
function wxAt(key, field, i){
  var W = (data && data.weather) || {}, v = null;
  for (var k in W) if (W[k] && W[k].sites && W[k].sites.indexOf(key) >= 0 && W[k][field])
    v = W[k][field][i];
  if (v == null && W.main && W.main[field]) v = W.main[field][i];
  return v == null ? null : v;
}
function dirName(d){ if (d == null) return "";
  return ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"][Math.round(d/22.5) % 16]; }

/* Tide over one day: hourly heights, turning points, and the rising (incoming) runs. */
function tideDay(key, day){
  var all = [], d = day.date;
  for (var i = 0; i < data.hours.length; i++)
    if (dateOf(data.hours[i]) === d) all.push({ i:i, h:hourOf(data.hours[i]), t:wxAt(key, "tideM", i) });
  if (all.filter(function(x){ return x.t != null; }).length < 12) return null;
  function T(j){ var x = all[j]; if (!x) { var k = j < 0 ? all[0].i + j : all[all.length-1].i + (j - all.length + 1);
                   return wxAt(key, "tideM", k); } return x.t; }
  var highs = [], lows = [], ts = [];
  all.forEach(function(x, j){
    var a = T(j-1), b = x.t, c = T(j+1);
    if (b == null) return; ts.push(b);
    if (a != null && c != null && b >= a && b > c) highs.push(x.h);
    if (a != null && c != null && b <= a && b < c) lows.push(x.h);
    x.rising = c != null ? c > b : (a != null ? b > a : null);
  });
  var mid = (Math.min.apply(null, ts) + Math.max.apply(null, ts)) / 2;
  all.forEach(function(x){ x.highish = x.t != null ? x.t >= mid : null; });
  return { hrs:all, highs:highs, lows:lows };
}
/* "6a–12p and from 7p" — the runs of `test` inside the dive hours. */
function runsText(td, test){
  var out = [], run = null, inDay = td.hrs.filter(function(x){ return x.h >= DAY0 && x.h <= DAY1; });
  inDay.forEach(function(x, j){
    if (test(x)) { if (!run) run = { a:x.h, z:x.h }; else run.z = x.h; }
    if ((!test(x) || j === inDay.length - 1) && run) {
      out.push(run.a === inDay[0].h && run.z === inDay[inDay.length-1].h ? "all day"
             : run.z === inDay[inDay.length-1].h ? "from " + fmtHour(run.a)
             : run.a === inDay[0].h ? "till " + fmtHour(run.z + 1)
             : fmtHour(run.a) + "–" + fmtHour(run.z + 1));
      run = null; }
  });
  return out.join(" and ");
}
function hoursList(hs){
  hs = hs.filter(function(h){ return h >= DAY0 - 2 && h <= DAY1 + 1; });
  return hs.map(function(h){ return "about " + fmtHour(h); }).join(" and ");
}

function tideGuide(key, day, pick){
  var td = tideDay(key, day), m = MCF[key], lines = [];
  var cur = td ? td.hrs.filter(function(x){ return x.h === pick.h; })[0] : null;
  var at = " at " + fmtHour(pick.h);
  function line(cls, k, txt){ lines.push('<div class="tg-line ' + cls + '"><span class="tg-key">' + k
                                        + '</span><span>' + txt + '</span></div>'); }
  /* entry: McFadyen's depth need at the shallow entries */
  if (m && (m.tide === "high" || m.tide === "low")) {
    var when = td ? hoursList(m.tide === "high" ? td.highs : td.lows) : "";
    var ok = cur && cur.highish != null ? (cur.highish === (m.tide === "high")) : null;
    line(ok === true ? "good" : ok === false ? "bad" : "", "🚪 Entry",
      "Shallow entry — get in around <b>" + m.tide + " tide</b>"
      + (when ? " (" + m.tide + " " + when + ")" : "") + "."
      + (ok === true ? ' <span class="tg-state">It’s there' + at + '.</span>'
         : ok === false ? ' <span class="tg-state">Wrong end of the tide' + at + '.</span>' : ""));
  }
  /* clarity: Botany outflow, or McFadyen's incoming/outgoing */
  var flow = BOTANY[key] ? "incoming" : (m && (m.tide === "incoming" || m.tide === "outgoing") ? m.tide : null);
  if (flow) {
    var runs = td ? runsText(td, function(x){ return x.rising === (flow === "incoming"); }) : "";
    var okc = cur && cur.rising != null ? (cur.rising === (flow === "incoming")) : null;
    var txt = "Clearest water on the <b>" + flow + " tide</b>"
      + (runs ? " — today it runs " + (flow === "incoming" ? "in " : "out ") + runs : "") + ".";
    if (BOTANY[key]) txt += (td && td.highs.length ? " Be in before the high at <b>" + hoursList(td.highs).replace(/about /g, "") + "</b>." : "")
      + " Once it turns and runs out, murkier water draining from Botany Bay passes by and drops the visibility.";
    txt += okc === true ? ' <span class="tg-state">Running that way' + at + '.</span>'
         : okc === false ? ' <span class="tg-state">Not' + at + '.</span>' : "";
    line(okc === true ? "good" : okc === false ? "bad" : "", "👁 Clarity", txt);
  }
  if (m && (m.note || m.id)) line("", "🗒️ Notes", (m.note ? m.note + " " : "")
    + '<a href="' + MCF_BASE + m.id + '" target="_blank" rel="noopener">Michael McFadyen’s dive notes ↗</a>');
  return lines.length ? '<div class="tg">' + lines.join("") + '</div>' : "";
}

/* DAY VERDICT — v1's describeConditions + describeTrend, rebuilt from what the Worker sent:
   the hourly scores (their bands) and the swell, wind wave and wind beside them. It names
   the best window, what turns the rest of the day worse and when, and the best hour. Words
   only; it changes no score. */
function dayVerdict(key, cells){
  var S = data.sites[key], sc = cells.filter(function(c){ return c.v != null; });
  if (!sc.length) return "";
  var rank = { easy:3, caution:2, avoid:1 };
  var windOnly = (data.windOnly || []).indexOf(key) >= 0 || (data.noNode || []).indexOf(key) >= 0;
  function g(a, i){ return a && a[i] != null ? a[i] : null; }
  function cond(i){ return { sw:windOnly ? null : g(S.swellH, i), sd:g(S.swellDir, i), sp:g(S.swellP, i),
                             ww:g(S.seaH, i), wk:wxAt(key, "windKmh", i), wd:wxAt(key, "windDir", i) }; }
  function full(c){ /* the biggest thing in the water */
    var o = [];
    if (c.sw != null && c.sw >= 0.25) o.push({ v:c.sw / 0.5, t:c.sw.toFixed(1) + " m " + dirName(c.sd) + " swell"
                                              + (c.sp ? " at " + Math.round(c.sp) + "s" : "") });
    if (c.ww != null && c.ww >= 0.2) o.push({ v:c.ww / 0.3, t:c.ww.toFixed(1) + " m wind waves" });
    if (c.wk != null && c.wk >= 12) o.push({ v:c.wk / 15, t:Math.round(c.wk) + " km/h " + dirName(c.wd) + " wind" });
    o.sort(function(a, b){ return b.v - a.v; });
    return o;
  }
  function change(a, b){ /* what grew most between a (better) and b (worse) */
    var o = [];
    if (a.sw != null && b.sw != null) o.push({ v:(b.sw - a.sw) / 0.5, t:"the " + dirName(b.sd) + " swell builds to "
                                              + b.sw.toFixed(1) + " m" + (b.sp ? " at " + Math.round(b.sp) + "s" : "") });
    if (a.ww != null && b.ww != null) o.push({ v:(b.ww - a.ww) / 0.3, t:"wind waves build to " + b.ww.toFixed(1) + " m" });
    if (a.wk != null && b.wk != null) o.push({ v:(b.wk - a.wk) / 15, t:"the " + dirName(b.wd) + " wind rises to "
                                              + Math.round(b.wk) + " km/h" });
    o.sort(function(x, y){ return y.v - x.v; });
    return o[0] && o[0].v > 0.15 ? o[0].t : null;
  }
  /* ties go to the hour nearest late morning, not to the pre-dawn first one */
  var top = sc.reduce(function(a, c){ return c.v > a.v || (c.v === a.v && Math.abs(c.h - 11) < Math.abs(a.h - 11)) ? c : a; });
  var low = sc.reduce(function(a, c){ return c.v < a.v ? c : a; });
  var bestB = top.b, worstB = low.b, out;

  if (bestB === worstB) {
    var f = full(cond(low.i));
    if (bestB === "easy") out = !f.length ? "Mostly flat with very little water movement all day."
      : /wind$/.test(f[0].t) && f[0].v >= 25/15
        ? "Easy all day, even as the " + f[0].t.replace(/^(\d+ km\/h) (\w+) wind$/, "$2 wind reaches $1") + "."
        : "Settled all day, with only minor " + f[0].t + ".";
    else if (bestB === "caution") out = "Some movement to be aware of all day, mainly from " + (f[0] ? f[0].t : "the tide") + ".";
    else out = "Rough and exposed all day — driven by " + (f[0] ? f[0].t : "strong water movement") + ".";

    var run = null, cur = null;

    });
    if (cur && (!run || cur.z - cur.a > run.z - run.a)) run = cur;
    var win = run.a === 0 ? "till " + fmtHour(cells[run.z].h + 1)
            : run.z === cells.length - 1 ? "from " + fmtHour(cells[run.a].h)
            : fmtHour(cells[run.a].h) + "–" + fmtHour(cells[run.z].h + 1);
    out = "<b>" + bandName(bestB) + " " + win + "</b>";
    var after = null, before = null, j;
    for (j = run.z + 1; j < cells.length; j++) if (rank[cells[j].b] < rank[bestB]) { after = cells[j]; break; }
    for (j = run.a - 1; j >= 0; j--) if (rank[cells[j].b] < rank[bestB]) { before = cells[j]; break; }
    var parts = [];
    if (after) { var why = change(cond(cells[run.z].i), cond(after.i));
      parts.push("from " + fmtHour(after.h) + " it turns " + bandName(after.b)
                 + (why ? " as " + why : "")); }
    if (before) { var why2 = change(cond(cells[run.a].i), cond(before.i));
      parts.push("before " + fmtHour(cells[run.a].h) + " it’s " + bandName(before.b)
                 + (why2 ? ", while " + why2.replace("builds to", "is").replace("rises to", "is at") : "")); }
    out += parts.length ? "; " + parts.join(", and ") + "." : ".";
    var lw = sc.filter(function(c){ return c.b === worstB; });
    if (worstB !== (after || before || {}).b && lw.length)
      out += " It reaches " + bandName(worstB) + " around " + fmtHour(lw[0].h) + ".";
  }
  /* the best hour, and what the water is doing then */
  var tc = cond(top.i), bits = [];
  var sea = tc.sw != null && tc.ww != null ? Math.sqrt(tc.sw*tc.sw + tc.ww*tc.ww) : (tc.ww != null ? tc.ww : tc.sw);
  if (sea != null) bits.push(sea < 0.05 ? "flat at the entry" : "sea at the entry " + sea.toFixed(1) + " m");
  if (tc.wk != null) bits.push(Math.round(tc.wk) + " km/h " + dirName(tc.wd) + " wind");
  out += " Best around <b>" + fmtHour(top.h) + "</b>" + (bits.length ? " (" + bits.join(", ") + ")" : "") + ".";
  return '<p class="dayv">' + out + '</p>';
}

/* The hour shown: the one tapped, else now if today and in range, else the middle of the
   best run. */
function pickCell(cells, nowI){
  var pick = selH != null ? cells.filter(function(c){ return c.h === selH; })[0] : null;
  if (!pick) pick = cells.filter(function(c){ return c.i === nowI; })[0];
  if (!pick) { var s = summarise(cells);
    pick = cells.filter(function(c){ return c.b === s.b; })[Math.floor(cells.length/6)] || cells[0]; }
  return pick;
}

var OV_LABEL = {"Freshwater": {"t": "Freshwater", "left": 0, "dy": 0}, "Fairlight": {"t": "Fairlight", "left": 1, "dy": 0}, "CTB": {"t": "CTB Bower Ln", "left": 1, "dy": 1.05}, "CampCove": {"t": "Camp Cove", "left": 0, "dy": -0.5}, "Chowder": {"t": "Chowder", "left": 1, "dy": 0}, "NorthBondi": {"t": "N Bondi", "left": 0, "dy": 0}, "SharkPoint": {"t": "Shark Pt", "left": 0, "dy": -0.45}, "Gordons": {"t": "Gordons", "left": 1, "dy": 0}, "SouthCoogee": {"t": "S Coogee", "left": 0, "dy": 0.45}, "LittleBay": {"t": "Little Bay", "left": 0, "dy": 0}, "BIWestmost": {"t": "BI W’most", "left": 1, "dy": 0}, "BIW": {"t": "BI W", "left": 1, "dy": 0.6}, "BIE": {"t": "BI E", "left": 0, "dy": 0}, "Monument": {"t": "Monument", "left": 0, "dy": -0.3}, "Steps": {"t": "Steps", "left": 0, "dy": 0.45}, "Oak": {"t": "Oak Park", "left": 0, "dy": 0}};

function detailFor(key, cells, nowI){
  var pick = pickCell(cells, nowI);
  var S = data.sites[key], i = pick.i, W = data.weather || {};
  function at(a){ return a && a[i] != null ? a[i] : null; }
  /* MIRROR THE WORKER'S TIDE FALLBACK. Three WillyWeather locations — coogee, cronulla
     and shellharbour — return wind but no tide at all, so Shark Point, Oak, Gordons,
     Little Bay, North Bondi and South Coogee have none of their own. The scorer already
     substitutes `main` (Sydney) for them, which is the tide the model was calibrated
     against; reading only the site's own group showed a bare dash while the score behind
     it was responding to tide perfectly well. */
  var wind = null, tide = null;
  for (var wk in W) { if (W[wk] && W[wk].sites && W[wk].sites.indexOf(key) >= 0) {
      wind = { k: at(W[wk].windKmh), d: at(W[wk].windDir) }; tide = at(W[wk].tideM); } }
  if (!wind && W.main) wind = { k: at(W.main.windKmh), d: at(W.main.windDir) };
  if (tide == null && W.main) tide = at(W.main.tideM);

  var sea = at(S.swellH), ws = at(S.seaH);
  var combined = (sea != null && ws != null) ? Math.sqrt(sea*sea + ws*ws) : sea;
  var stat = function(l, v){ return '<span class="stat"><b>' + l + '</b><span>' + v + '</span></span>'; };
  var dirTxt = function(d){ if (d == null) return "–";
    var p = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
    return p[Math.round(d/22.5) % 16]; };

  var ten = DAYS.map(function(d){
    var c = cellsFor(key, d), s2 = summarise(c);
    /* the day's step comes from its WORST scored hour, so the ten-day strip shades by the
       same severity the band is chosen from rather than by an average nobody dives */
    var worst = null;
    c.forEach(function(x){ if (x.v != null && (worst === null || x.v < worst)) worst = x.v; });
    return '<span class="cell ' + s2.b + ' ' + step(worst) + '" title="' + d.date
         + ' — ' + s2.t + '"></span>';

    + stat("Sea at entry", combined != null ? combined.toFixed(2) + " m" : "–")
    + stat("Swell", (sea != null ? sea.toFixed(2) + " m " : "") + dirTxt(at(S.swellDir))
        + (at(S.swellP) != null ? " · " + at(S.swellP).toFixed(0) + "s" : ""))
    + stat("Wind wave", ws != null ? ws.toFixed(2) + " m" : "–")
    + stat("Wind", wind && wind.k != null ? Math.round(wind.k) + " km/h " + dirTxt(wind.d) : "–")
    + stat("Tide", tide != null ? tide.toFixed(2) + " m" : "–")

    + '</div>';

var DAYS = [];
function renderDays(){

     fetches WillyWeather from yesterday so the hours before today's first tide turn are
     bracketed by one, which is a real fix and not a bug. But it means index 0 is yesterday,
     so defaulting dayIx to 0 opened the app on a day already gone. */
  var ti = -1;
  for (var d = 0; d < DAYS.length; d++) { if (DAYS[d].date >= TODAY) { ti = d; break; } }

       cutoff, the lean clamp, the visibility culls. Those were independent knobs,
       which is why fixing one kept breaking another.

       The model is one statement: energy marches in the swell direction and
       spreads sideways as it goes, at a rate set by the wavelength. Land is a zero
       boundary. Everything previously enforced by rules now falls out of it:

         · a cone of shadow behind EVERY landmass, headland or island alike
         · shadows that FILL IN with distance instead of being all-or-nothing —
           which is what the ray test could never do, and why open sea kept
           coming out blank
         · long period wrapping further than short, because the spreading rate is
           proportional to wavelength
         · no energy out of land, because land is a zero boundary
         · a direction that can never oppose the swell, because it is the energy
           flux vector and its along-swell component is positive by construction

       Bathymetry slots in here later: depth sets the local wavelength (hence the
       spreading), the celerity gradient adds true refraction, and H/d gives
       breaking. None of that changes the shape of this code.
       ───────────────────────────────────────────────────────────────────────── */
    var WAVE = null;          // { E, DX, DY } on the render grid
    var _upOverrideM = 0;     // >0 forces the upwave reach, for table generation

    function solveWave(dir, per) {
      var th = (dir + 180) * Math.PI / 180;
      var ux = Math.sin(th), uy = -Math.cos(th);     // travel, box metric units
      var vx = -uy, vy = ux;                         // transverse

      // Domain reaches upwave far enough to include the land doing the sheltering
      // — Botany Bay is shadowed by ground several km outside the frame.
      // The domain must be wide enough that its edges sit in undisturbed sea. Too
      // narrow and a site inside a bay starts its march on land — at Bare Island the
      // whole inflow row was La Perouse, so the field came out uniformly zero.
      // Domain floors expressed in METRES against the frame's own geometry, not as
      // box fractions. The old 0.8/1.6 floors ballooned with span: a 4.6 km frame
      // demanded a 7.4 km march and a 14.7 km lateral half-width, far outside any
      // land data, while a 700 m frame asked for 3 km / 4 km. Small sites keep
      // their exact old values (3000 m / 4000 m); only big frames are reined in.
      // Keep in step with domain_reach() in tools/coastline/build_coast.py, which
      // sizes the far mask to cover precisely this.
      var SY = SPAN * ASP;
      // UPWAVE REACH OVERRIDE, used only when generating a site's dispersion table.
      // Normally the march starts 3 km upwave so distant land can shelter the site;
      // a table only has to carry swell the last few hundred metres from its NSW
      // nearshore node to the entry. Defaults to 0 = unchanged behaviour.
      var UPm = _upOverrideM > 0 ? _upOverrideM : Math.max(3000, SY + 1500);
      var HALFm = _upOverrideM > 0 ? Math.max(Math.hypot(SPAN, SY) + 400, _upOverrideM)

      // 4.6 km frame it still reached 11 km downwave — straight out of the mask.
      // Downwave only has to cover the frame's far corner: the march is forward,
      // so nothing beyond the frame can influence anything drawn inside it.
      var DOWNm = Math.min(1.2 * 2 * SPAN, Math.hypot(SPAN, SY) + 900);
      var UP = UPm / (2 * SPAN), DOWN = DOWNm / (2 * SPAN), HALF = HALFm / (2 * SPAN);

      var dXi = (UP + DOWN) / NX, dEta = (2 * HALF) / NH;

      // sigma^2 = lambda*xi/(2*pi), so the diffusion constant is lambda/(4*pi).

        // is the dangerous default: phantom ocean pours full swell in over ground that
        // is really land. Counted so a check can assert it never happens.
        // NOT `outside` — that counter already exists further down with a different
        // meaning (render cells outside the SOLVED DOMAIN). Overloading it made this
        // read 1.4% when the true figure was 0, and sampled+outside came out constant,
        // which is what gave the collision away.

      // free of a stability limit — an explicit march needed ~10x the steps.

          // arriving from outside the domain rather than draining away at its sides.

          // the diagonal drops with it — leaving the diagonal at 1+2r turned every
          // shoreline into a sink and bled the whole field to nothing over the march.

      // the energy flux: along-swell plus the transverse gradient term.
      var N = FW * FH;

        var xi = mx * ux + my * uy, eta = mx * vx + my * vy;

        sampled++;

        var j0 = Math.min(NH - 1, Math.max(0, Math.floor(fj)));

        var e = (e00 * (1 - ty) + e01 * ty) * (1 - tx) + (e10 * (1 - ty) + e11 * ty) * tx;
        Eo[idx] = e;
        var gEta = ((e01 - e00) * (1 - tx) + (e11 - e10) * tx) / dEta;
        // flux = (E, -D dE/deta) in (xi, eta); the along-swell part is never
        // negative, so the arrow can never point back into the swell.
        // Limit the lateral term to tan(LEAN). It blows up wherever E is small —
        // the ratio, not the physics, is what produced 50 deg arrows the moment the
        // lees filled with real energy. Capping the ratio enforces the same limit
        // the register states, at the one place it can run away.
        var latMax = Math.tan(LEAN);

                       lam: +lam.toFixed(3), inflowWater: inflowWater, nanHits: nanHits,
                       profile: prof.join(' '), outside: outside, sampled: sampled,
                       DOWN: +DOWN.toFixed(2), offData: offData, offRead: offRead,

        var mx = (c + 0.5) / FW, my = (r + 0.5) / FH * ASP;

    function fidx(mx, my) {

      return ((my / ASP * FH) | 0) * FW + ((mx * FW) | 0);
    }

      var W = M._W, X = function (v) { return v * W; }, a = half;

    // ── wind chop ───────────────────────────────────────────────────────────

    // ── chrome ──────────────────────────────────────────────────────────────

      ctx.font = '700 ' + f + 'px ui-sans-serif,system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fillText('N', x, y + r * 0.85);
      ctx.restore();
    }

    function halo(txt, x, y, font, fill, align) {
      var W = M._W;
      ctx.font = font; ctx.textAlign = align || 'center'; ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(6,28,38,0.85)'; ctx.lineWidth = Math.max(2.5, 0.008 * W);
      ctx.strokeText(txt, x, y); ctx.fillStyle = fill; ctx.fillText(txt, x, y);
    }

    function drawSiteMarker() {
      var W = M._W, H = M._H, x = SITEPT[0] * W, y = SITEPT[1] * H;
      var nf = Math.max(10, (compact ? 0.040 : 0.024) * W);
      var vf = Math.max(12, (compact ? 0.052 : 0.034) * W);
      var cf = Math.max(8, 0.019 * W), dot = Math.max(4, 0.013 * W);
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, dot, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd166'; ctx.fill();
      ctx.lineWidth = Math.max(1.5, 0.004 * W); ctx.strokeStyle = 'rgba(6,28,38,0.9)'; ctx.stroke();
      ctx.textBaseline = 'alphabetic';
      // The name normally sits above the dot, but a site near the top of the frame
      // would have it drawn off the canvas — at Fairlight the label was simply
      // missing. When there is no room above, everything stacks downward instead.
      var above = (y - dot - nf * 1.6) > 2;
      var vy = y + dot + vf * 1.15;
      if (!compact) {
        if (above) halo(M.name, x, y - dot - nf * 0.55, '700 ' + nf + 'px ui-sans-serif,system-ui,sans-serif', '#ffffff');
        else { halo(M.name, x, vy, '700 ' + nf + 'px ui-sans-serif,system-ui,sans-serif', '#ffffff'); vy += nf * 1.25; }
      }
      // The entry used to print sitePct here — the share of the offshore swell's
      // energy that reaches it. Removed: on a screen already dense with colour and
      // numbers it read as a second score, and it runs the opposite way (high = more
      // swell getting in = worse, where a high score is better). The compact tiles
      // made it worse still, dropping the 'of the swell gets in' caption and leaving
      // a bare % beside the score. payload.sitePct is still computed, so restoring
      // this is one block if it is ever wanted back.
      ctx.restore();
    }

    /* Overview (v2 only): every entry as a dot in its band colour, labelled. */
    function drawDots() {
      var W = M._W, H = M._H, r = Math.max(5, 0.017 * W), f = Math.max(10, 0.03 * W);
      ctx.save(); ctx.textBaseline = 'middle';
      _dots.forEach(function (d) {
        var x = d.u * W, y = d.v * H;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = d.color; ctx.fill();
        ctx.lineWidth = Math.max(1.5, 0.004 * W); ctx.strokeStyle = 'rgba(6,28,38,0.95)'; ctx.stroke();
        if (d.label) halo(d.label, x + (d.left ? -1 : 1) * (r + 4), y + (d.dy || 0) * f,
                          '600 ' + f + 'px ui-sans-serif,system-ui,sans-serif', '#ffffff', d.left ? 'right' : 'left');
      });
      ctx.restore();
    }

    // Offshore height, pinned out in open water on the side the swell comes from.
    function drawOffshorePin() {
      var W = M._W;
      var th = _sw * Math.PI / 180;
      var sx = SITEPT[0], sy = SITEPT[1] * ASP;
      // Search out along the swell bearing, then fan either side of it. Two rules
      // matter as much as "is it water": stay well clear of the site marker, or the
      // offshore figure prints straight through the at-the-site figure (Fairlight
      // showed "0.5 m 1.2 m" as one run-on string); and stay clear of the two
      // direction discs, which own the corner it would otherwise drift into.
      var MINSEP = 0.185;
      var dx = (compact ? 0.34 : 0.42), dy = ((SITEPT[1] < 0.42 && SITEPT[0] < 0.62) ? 0.84 : 0.16) * ASP;
      var mx = null, my = null;
      var fan = [0, -22, 22, -45, 45, -70, 70];
      for (var f = 0; f < fan.length && mx == null; f++) {
        var a = th + fan[f] * Math.PI / 180, ux = Math.sin(a), uy = -Math.cos(a);
        for (var t = 0.42; t >= MINSEP; t -= 0.025) {
          var cx = clamp(sx + ux * t, 0.11, 0.89);
          var cy = clamp(sy + uy * t, ASP * 0.13, ASP * 0.85);
          if (landM(cx, cy)) continue;
          if (Math.hypot(cx - sx, cy - sy) < MINSEP) continue;
          if (Math.hypot(cx - dx, cy - dy) < 0.16) continue;
          mx = cx; my = cy; break;
        }
      }
      /* v2: the node's real position. Inside the frame it gets a dot and the height
         beside it; outside, the searched spot keeps the height and says where it is. */
      var nd = S && S.node, cap = _dots ? 'open coast' : 'at node';
      var vf0 = Math.max(11, (compact ? 0.040 : 0.034) * W), cf0 = Math.max(8, 0.019 * W);
      if (nd && !_dots && nd.u > 0.03 && nd.u < 0.97 && nd.v > 0.03 && nd.v < 0.97) {
        var nx = nd.u * W, ny = nd.v * M._H, nr = Math.max(3.5, 0.011 * W);
        ctx.save();
        ctx.beginPath(); ctx.arc(nx, ny, nr, 0, Math.PI * 2);
        ctx.fillStyle = '#4d9dff'; ctx.fill();
        ctx.lineWidth = Math.max(1.5, 0.004 * W); ctx.strokeStyle = '#ffffff'; ctx.stroke();
        var lft = nd.u > 0.72, lx = nx + (lft ? -1 : 1) * (nr + 5);
        ctx.textBaseline = 'alphabetic';
        halo(_hgt.toFixed(1) + ' m', lx, ny + vf0 * 0.1, '600 ' + vf0 + 'px ui-sans-serif,system-ui,sans-serif',
             '#ffffff', lft ? 'right' : 'left');
        if (!compact) halo('at node', lx, ny + vf0 * 0.1 + cf0 * 1.35, '500 ' + cf0 + 'px ui-sans-serif,system-ui,sans-serif',
             'rgba(228,240,246,0.92)', lft ? 'right' : 'left');
        ctx.restore();
        return;
      }
      if (nd && !_dots) {
        var D = ['N','NE','E','SE','S','SW','W','NW'][Math.round(nd.b / 45) % 8];
        cap = 'node ' + (nd.d >= 1000 ? (nd.d / 1000).toFixed(1) + ' km' : nd.d + ' m') + ' ' + D;
      }
      if (mx == null) return;
      var x = mx * W, y = my * W;
      var vf = Math.max(11, (compact ? 0.040 : 0.034) * W), cf = Math.max(8, 0.019 * W);
      ctx.textBaseline = 'alphabetic';
      // Deliberately quieter than the at-the-site figure. In the grid the caption
      // does not fit, and two equally loud numbers on one small map read as a pair
      // of readings for the same spot rather than "out there" vs "here".
      halo(_hgt.toFixed(1) + ' m', x, y, '600 ' + vf + 'px ui-sans-serif,system-ui,sans-serif',
           compact ? 'rgba(214,232,240,0.82)' : '#ffffff');
      if (!compact) halo(cap, x, y + cf * 1.35, '500 ' + cf + 'px ui-sans-serif,system-ui,sans-serif', 'rgba(228,240,246,0.92)');
    }

    M._render = function () {
      var W = M._W, H = M._H;
      if (!W || !RINGS.length) return;
      // Deferred fields are built HERE, at the moment of drawing, not when the map
      // was told what to show. Skipping the rebuild for an offscreen map but still
      // letting it paint left it drawing the PREVIOUS swell direction — tiles in the
      // grid disagreed with each other, and the detail sheet (which is off-viewport
      // until it slides up) opened showing the last hour's arrows.
      if (_pending) applyFields();
      ctx.clearRect(0, 0, W, H);
      var g = ctx.createLinearGradient(W, 0, 0, H);
      g.addColorStop(0, '#0a3d4f'); g.addColorStop(0.6, '#0e5f78'); g.addColorStop(1, '#1f86a3');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.clip(waterClip, 'evenodd');
      ctx.strokeStyle = 'rgba(110,180,210,0.4)'; ctx.lineWidth = 0.04 * W;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(coastStroke);
      drawChopLayer();
      rollFlow();
      ctx.restore();
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#ddcfae'; ctx.fill(landPath, 'evenodd');
      ctx.strokeStyle = '#bfae86'; ctx.lineWidth = Math.max(1.2, 0.005 * W);
      ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(coastStroke);
      if (!_windOnly) drawOffshorePin();
      if (_dots) drawDots(); else drawSiteMarker();
      // Both arrows point where the wave / wind is TRAVELLING TO, and both are
      // labelled: on one bay you can learn which colour is which, but a diver
      // moving between 13 maps should never have to remember.
      // Park the two discs in the top-left, unless that is where the site is — at
      // Fairlight the marker and its height sat right under the wind arrow.
      var ay = ((SITEPT[1] < 0.42 && SITEPT[0] < 0.62) ? 0.84 : (compact ? 0.17 : 0.16)) * H;
      if (!_windOnly) {
        var st = (_sw + 180) * Math.PI / 180;
        dirArrow((compact ? 0.13 : 0.20) * W, ay, Math.sin(st), -Math.cos(st), '#4d9dff', compact ? null : 'SWELL');
      }
      var wt = (_windDir + 180) * Math.PI / 180;
      // With no swell arrow drawn there is no reason to leave a gap where it would
      // have been — the wind arrow takes the first slot.
      dirArrow((_windOnly ? (compact ? 0.13 : 0.20) : (compact ? 0.34 : 0.42)) * W, ay,
               Math.sin(wt), -Math.cos(wt), '#ffb35c', compact ? null : 'WIND');
      drawNorth();
    };

    M.fit = function () {
      var cssW = Math.round(cv.getBoundingClientRect().width) || cv.clientWidth || 0;
      if (!cssW || !S) return false;
      var dpr = Math.min(window.devicePixelRatio || 1, compact ? 1.75 : 3);
      M._W = cssW; M._H = Math.round(cssW * ASP);
      cv.style.height = M._H + 'px';
      cv.width = Math.round(M._W * dpr); cv.height = Math.round(M._H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildPaths(); M._render();
      return true;
    };

    /* d = { swellDir, swellH, swellP, windDir, windKmh, eLit, eWrap, sitePct, chop } */
    M.set = function (siteKey, name, d) {
      var C = (typeof SITE_COAST !== 'undefined') && SITE_COAST[siteKey];
      // No outline, or one that traced no land, means there is nothing to shelter
      // anything — an all-water map would imply "fully exposed", which is a claim,
      // not a blank. Say nothing instead.
      if (!C || !C.rings || !C.rings.length) { M._on = false; return false; }
      S = C; M.key = siteKey; M.name = name || siteKey;
      ASP = C.aspect; RINGS = C.rings; SPAN = C.span; SITEPT = C.site;
      BM = bitsFor(siteKey, C);
      if (typeof d.swellDir === 'number' && isFinite(d.swellDir)) _sw = ((d.swellDir % 360) + 360) % 360;
      if (typeof d.swellH === 'number' && isFinite(d.swellH)) _hgt = Math.max(0, d.swellH);
      if (typeof d.swellP === 'number' && isFinite(d.swellP) && d.swellP > 0) _sp = d.swellP;
      if (typeof d.windDir === 'number' && isFinite(d.windDir)) _windDir = ((d.windDir % 360) + 360) % 360;
      _eLit = d.eLit || 0; _eWrap = d.eWrap || 0;
      _windOnly = !!d.windOnly;
      _sitePct = (typeof d.sitePct === 'number' && isFinite(d.sitePct)) ? d.sitePct : null;
      _windLevel = clamp(d.chop || 0, 0, 1);
      _dots = d.dots || null;
      FW = compact ? 96 : 190;   // grid tiles are ~230 px; 96 is plenty there
      M._on = true;
      // Only build the fields for a map somebody can see. On the all-sites grid most
      // tiles are below the fold, and rebuilding all thirteen on every slider step
      // was the bulk of a cold scrub. Marking it pending defers the work to the first
      // frame that actually draws — which for an offscreen tile never comes.
      _pending = true;
      if (!M.fit()) setTimeout(M.fit, 60);
      return true;
    };

    function applyFields() {
      _pending = false;
      var fk = M.key + '|' + Math.round(_sw) + '|' + Math.round(_sp * 10) + '|' +
               Math.round(_hgt * 100) + '|' + Math.round(_eLit * 1000) + '|' + Math.round(_eWrap * 1000);
      // A wind-only site never draws the swell layer, so the line-of-sight
      // ray-casting behind it is pure waste.
      if (!_windOnly && fk !== _fieldKey) { rebuildField(); _fieldKey = fk; }
      var ck = M.key + '|' + Math.round(_windDir / 3) * 3;
      if (ck !== _chopKey) { _cfield = computeChop(ck); _chopKey = ck; }
    }

    // Introspection for tools/workbench.html. The regression checks assert on these
    // numbers rather than on pixels, so a reported problem becomes a permanent test.
    // Table generation only. Returns the previous value so a caller can restore it;
    // 0 means normal scoring behaviour.
    M.setUpwaveReach = function (metres) {
      var was = _upOverrideM;
      _upOverrideM = (typeof metres === 'number' && metres > 0) ? metres : 0;
      _fieldKey = null;
      return was;
    };

    M.debug = function () {
      var water = 0, litN = 0, leeN = 0, lean = 0, i;
      var th = (_sw + 180) * Math.PI / 180, ux = Math.sin(th), uy = -Math.cos(th);
      if (FWATER && FE) {
        for (i = 0; i < FWATER.length; i++) {
          if (!FWATER[i]) continue;
          water++;
          var e = WAVE ? WAVE.E[i] : 0;
          if (e > 0.5) litN++;
          else if (e > 0.03) leeN++;
          if (FE[i] >= CUT) {
            var ang = Math.acos(clamp(FWX[i] * ux + FWY[i] * uy, -1, 1)) * 180 / Math.PI;
            if (ang > lean) lean = ang;
          }
        }
      }
      var eMax = 0, eSum = 0;
      if (WAVE) for (i = 0; i < WAVE.E.length; i++) {
        if (!FWATER[i]) continue;
        if (WAVE.E[i] > eMax) eMax = WAVE.E[i];
        eSum += WAVE.E[i];
      }
      // Energy and arrival direction AT THE SITE — the quantity the card reports, and
      // what a generated dispersion table is built from.
      //
      // AVERAGE a small disc of water; do not take the single nearest cell. The site is
      // a shore entry, its own cell is usually land, and whichever lone water cell came
      // out nearest flipped as the field shifted with swell direction — which made the
      // transmit curve swing 2.7x between adjacent 10 deg bins. Measured against the
      // Swim app's trusted Bower Lane table: single-cell roughness 0.075 against the
      // reference's 0.029, correlation 0.875; averaged, roughness 0.030 and correlation
      // 0.967. Same physics either way — it was a sampling artefact.
      var eSite = 0, siteLeanDeg = 0, found = 0;
      if (WAVE && FWATER && FW) {
        var sc0 = clamp((SITEPT[0] * FW) | 0, 0, FW - 1),
            sr0 = clamp((SITEPT[1] * FH) | 0, 0, FH - 1);
        // Weight by 1/(1+r) so the water right at the entry still dominates, but no
        // single cell can carry the answer on its own.
        var eSum2 = 0, wSum = 0, lx = 0, ly = 0, SITE_RAD = 3;
        for (var dr = -SITE_RAD; dr <= SITE_RAD; dr++) {
          for (var dc = -SITE_RAD; dc <= SITE_RAD; dc++) {
            var rr2 = sr0 + dr, cc2 = sc0 + dc;
            if (rr2 < 0 || rr2 >= FH || cc2 < 0 || cc2 >= FW) continue;
            var ii = rr2 * FW + cc2;
            if (!FWATER[ii]) continue;
            var w2 = 1 / (1 + Math.hypot(dr, dc));
            eSum2 += WAVE.E[ii] * w2; wSum += w2;
            lx += FWX[ii] * w2; ly += FWY[ii] * w2;
            found = 1;
          }
        }
        if (found && wSum > 0) {
          eSite = +(eSum2 / wSum).toFixed(4);
          var ln = Math.hypot(lx, ly) || 1;
          siteLeanDeg = Math.round(Math.acos(clamp((lx / ln) * ux + (ly / ln) * uy, -1, 1)) * 180 / Math.PI);
        }
      }
      return { eSite: eSite, siteLeanDeg: siteLeanDeg,
               eMax: +eMax.toFixed(3), eMean: water ? +(eSum / water).toFixed(3) : 0,
               solveInfo: WAVE && WAVE.info,
               sw: _sw, travelDx: ux, travelDy: uy, site: SITEPT,
               eLit: _eLit, eWrap: _eWrap, compact: compact,
               waterCells: water,
               litFrac: water ? litN / water : 0,
               wrapFrac: water ? leeN / water : 0,
               maxLeanDeg: Math.round(lean),
               tips: 0 };
    };

    M.destroy = function () {
      M._on = false;
      var i = LIVE.indexOf(M); if (i >= 0) LIVE.splice(i, 1);
    };

    LIVE.push(M);
    start();
    // Offscreen maps must not burn a frame budget — 13 canvases at 60 fps is
    // real work, and most of them are below the fold most of the time.
    if (typeof IntersectionObserver !== 'undefined') {
      // _vis defaults to true so a build without IntersectionObserver still
      // paints. Where there IS one, start false and let its first callback
      // (which always fires on observe) say what is really on screen. Left
      // true, every tile painted once before the observer could object — which
      // is exactly the work the _pending deferral exists to avoid.
      M._vis = false;
      new IntersectionObserver(function (es) {
        M._vis = es[0].isIntersecting;
        if (M._vis && M._on && _pending) { applyFields(); M.fit(); }
      }, { rootMargin: '150px' }).observe(cv);
    }
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(function () { if (M._on) M.fit(); }).observe(cv);
    }
    return M;
  }

  return { create: create };
})();
</script>
</body>
</html>
